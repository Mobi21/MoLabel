benchmark_id: beir
goal: Evaluate Codex as an external MoLabel operator on the grounded BEIR slice using
  only the public CLI and installed benchmark skill, with MiniMax 2.7 highspeed as the current
  labeling engine.
current_labeling_engine: MiniMax 2.7 highspeed
authority_pack: true
reference_workspace_root: ../workbench
benchmark_profiles:
- canonical
- operator-primary
- smoke
aggregation: weighted_mean
label_quality_weight: 0.7
checklist_weight: 0.3
blocking_check_ids:
- uses_public_cli_and_skill_only
- configures_minimax_2_7_profile
- preserves_artifact_integrity
checks:
- check_id: uses_public_cli_and_skill_only
  phase: setup
  description: Uses only documented MoLabel CLI surfaces with the installed benchmark
    skill.
  weight: 1.0
- check_id: configures_minimax_2_7_profile
  phase: setup
  description: Registers MiniMax 2.7 highspeed through the Anthropic-compatible adapter path.
  weight: 1.0
- check_id: preserves_fixed_ranking_depth
  phase: run
  description: Emits exactly the configured ranking depth per query.
  weight: 1.0
- check_id: records_corpus_snapshot_metadata
  phase: run
  description: Persists corpus snapshot id and hash metadata with the ranking artifact.
  weight: 1.0
- check_id: writes_benchmark_run_artifacts
  phase: scoring
  description: Writes summary and report artifacts under workbench/benchmarks/runs.
  weight: 1.0
- check_id: preserves_artifact_integrity
  phase: scoring
  description: Leaves ranked retrieval artifacts schema-valid after the run.
  weight: 1.0
