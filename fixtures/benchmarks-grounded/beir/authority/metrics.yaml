benchmark_id: beir
aggregation: weighted_mean
primary_metric_id: ndcg_at_5
metrics:
- metric_id: ndcg_at_5
  name: nDCG@5
  metric_type: ndcg_at_k
  modes:
  - model
  - workflow
  - operator
  variants:
  - paper_direct
  - molabel_operated
  fields:
  - ranking
  metric_options:
    qrels_field: qrels
    k: 5
    fixed_depth: 5
    require_corpus_metadata: true
  weight: 1.0
