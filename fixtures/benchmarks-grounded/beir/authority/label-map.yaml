benchmark_id: beir
record_id_field: record_id
dataset_label_fields:
- candidate_doc_ids
- qrels
target_label_fields:
- ranking
field_mappings:
- dataset_field: candidate_doc_ids
  target_field: ranking
  mapping:
    structure: ranked_results
  lossy: false
  notes: Ranking output preserves document ids and ordering.
- dataset_field: qrels
  target_field: ranking
  mapping:
    structure: external_qrels_sidecar
  lossy: false
  notes: Qrels remain external to the ranking artifact and are ingested through metric_options.qrels_field.
