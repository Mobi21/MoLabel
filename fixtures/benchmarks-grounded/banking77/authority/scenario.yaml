benchmark_id: banking77
scenario_id: banking77
track: grounded
name: BANKING77 Grounded Intent Benchmark
description: >
  Redistributable BANKING77 subset representing banking customer-service
  intents. The benchmark keeps the single-label classification contract from
  the paper while remaining small enough for repeatable CLI-driven runs and
  biased towards near-neighbor intent confusions.
authority_pack: true
reference_workspace_root: ../workbench
current_labeling_engine: MiniMax 2.7 highspeed
benchmark_profiles:
  - canonical
  - operator-primary
  - smoke
raw_format: jsonl
source_path: workbench/benchmarks/splits/test.jsonl
loader_plugin: molabel.loaders.jsonl
record_id_field: record_id
task_schema_path: workbench/config/task-schemas/banking77-grounded-v1.yaml
workflow_path: workbench/workflows/banking77-grounded.yaml
paper_metadata_path: workbench/benchmarks/paper.yaml
label_map_path: workbench/benchmarks/label-map.yaml
metrics_path: workbench/benchmarks/metrics.yaml
baselines_path: workbench/benchmarks/baselines.yaml
operator_path: workbench/benchmarks/operator.yaml
gold_labels_path: workbench/benchmarks/gold/molabel-operated/test.jsonl
paper_gold_path: workbench/benchmarks/gold/paper-direct/test.jsonl
molabel_gold_path: workbench/benchmarks/gold/molabel-operated/test.jsonl
split_paths:
  - workbench/benchmarks/splits/test.jsonl
human_label_paths:
  - workbench/benchmarks/human-labels/reviewer-nina.jsonl
review_paths:
  - workbench/benchmarks/reviews/reviewer-owen.jsonl
evaluation_modes:
  - model
  - workflow
  - operator
scoring_variants:
  - paper_direct
  - molabel_operated
default_model_profile:
  provider_type: anthropic
  provider_name: MiniMax
  model_identifier: MiniMax-M2.7-highspeed
  sdk_stack: anthropic_sdk
  agent_role: proposer
evaluation_fields:
  - intent_label
requires_dataset_download: false
redistribution_notes:
  - The upstream PolyAI-LDN BANKING77 repository is MIT-licensed.
  - The committed utterances are representative synthetic examples matched to
    BANKING77 intent categories, biased towards near-neighbor confusions.
subset_policy:
  source_split: test
  selection_strategy: curated-confusion-heavy
  subset_size: 16
expected_intentional_errors: 2
