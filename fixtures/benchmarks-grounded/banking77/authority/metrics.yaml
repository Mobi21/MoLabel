benchmark_id: banking77
aggregation: weighted_mean
primary_metric_id: intent_accuracy
metrics:
  - metric_id: intent_accuracy
    name: Intent Accuracy
    metric_type: accuracy
    modes:
      - model
      - workflow
      - operator
    variants:
      - paper_direct
      - molabel_operated
    fields:
      - intent_label
    weight: 1.0
  - metric_id: intent_macro_f1
    name: Intent Macro F1
    metric_type: macro_f1
    modes:
      - model
      - workflow
      - operator
    variants:
      - paper_direct
      - molabel_operated
    fields:
      - intent_label
    weight: 0.5
  - metric_id: intent_exact_match
    name: Intent Exact Match
    metric_type: exact_match
    modes:
      - workflow
      - operator
    variants:
      - molabel_operated
    fields:
      - intent_label
    weight: 0.5
    notes: Exact match on the normalized MoLabel label view.
tax_definitions:
  - tax_id: model_tax
    name: Model Tax
    minuend_mode: model
    minuend_variant: paper_direct
    subtrahend_mode: model
    subtrahend_variant: molabel_operated
    minuend_stage: paper_model
    subtrahend_stage: molabel_model
  - tax_id: autorun_tax
    name: Autorun Tax
    minuend_mode: model
    minuend_variant: molabel_operated
    subtrahend_mode: workflow
    subtrahend_variant: molabel_operated
    minuend_stage: molabel_model
    subtrahend_stage: workflow_autorun
  - tax_id: review_tax
    name: Review Tax
    minuend_mode: workflow
    minuend_variant: molabel_operated
    subtrahend_mode: workflow
    subtrahend_variant: molabel_operated
    minuend_stage: workflow_autorun
    subtrahend_stage: workflow_reviewed
  - tax_id: operator_tax
    name: Operator Tax
    minuend_mode: workflow
    minuend_variant: molabel_operated
    subtrahend_mode: operator
    subtrahend_variant: molabel_operated
    minuend_stage: workflow_reviewed
    subtrahend_stage: operator_reviewed
