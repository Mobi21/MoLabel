benchmark_id: msmarco
record_id_field: record_id
dataset_label_fields:
- candidate_doc_ids
- qrels
target_label_fields:
- ranking
field_mappings:
- dataset_field: candidate_doc_ids
  target_field: ranking
  mapping:
    structure: ranked_results
  lossy: false
  notes: Passage ranking preserves ranked result ids and ordering.
- dataset_field: qrels
  target_field: ranking
  mapping:
    structure: external_qrels_sidecar
  lossy: false
  notes: Binary qrels are scored externally to the ranking artifact.
