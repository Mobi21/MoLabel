benchmark_id: scifact
record_id_field: record_id
dataset_label_fields:
  - label
  - evidence
target_label_fields:
  - paper_label
  - verdict
  - paper_evidence_sets
  - evidence_atoms
field_mappings:
  - dataset_field: label
    target_field: paper_label
    mapping:
      SUPPORT: SUPPORT
      CONTRADICT: CONTRADICT
      NOT_ENOUGH_INFO: NOT_ENOUGH_INFO
    lossy: false
    notes: >
      Paper-direct view preserves SciFact's native verdict vocabulary. The
      shared verification scorer normalizes SUPPORT/CONTRADICT/NOT_ENOUGH_INFO
      to the FEVER-compatible supports/refutes/nei set via verdict aliases.
  - dataset_field: label
    target_field: verdict
    mapping:
      SUPPORT: supports
      CONTRADICT: refutes
      NOT_ENOUGH_INFO: nei
    lossy: false
    notes: >
      MoLabel-operated view uses the normalized FEVER-equivalent verdict
      vocabulary so downstream scoring and reporting stay consistent across
      verification benchmarks.
  - dataset_field: evidence
    target_field: paper_evidence_sets
    mapping:
      structure: list_of_alternative_rationale_sets
      atom_format: "{doc_id}_sentence_{sentence_index}"
    lossy: false
    notes: >
      Each gold rationale from the paper becomes one alternative evidence set
      of sentence atoms. Matching at least one complete set satisfies the
      joint verdict-plus-evidence success rule.
  - dataset_field: evidence
    target_field: evidence_atoms
    mapping:
      operation: flatten
      deduplicate: true
    lossy: true
    notes: >
      Flattens the per-rationale sentence sets into a single deduplicated
      atom list for MoLabel-operated scoring.
