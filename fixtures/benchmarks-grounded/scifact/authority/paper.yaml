benchmark_id: scifact
paper_title: "Fact or Fiction: Verifying Scientific Claims"
paper_url: https://aclanthology.org/2020.emnlp-main.609/
citation: >
  Wadden, Lin, Lo, Wang, van Zuylen, Cohan, Hajishirzi. Fact or Fiction:
  Verifying Scientific Claims. EMNLP 2020.
publication_year: 2020
dataset_name: SciFact
dataset_url: https://github.com/allenai/scifact
source_repository_url: https://github.com/allenai/scifact
dataset_license: CC BY-NC 2.0
repository_license: Apache-2.0
redistribution_status: subset_allowed
task_summary: >
  Verify scientific claims against a corpus of abstracts, returning one of
  SUPPORT, CONTRADICT, or NOT_ENOUGH_INFO together with the sentences that
  support or contradict the claim.
original_task_definition: >
  For each claim, retrieve supporting or contradicting abstracts, assign a
  verdict per abstract, and identify rationale sentences grounding that
  verdict.
original_metrics:
  - abstract label accuracy
  - abstract-level selection F1
  - sentence-level rationale F1
notes:
  - Full dataset has ~1,400 scientific claims and ~5,000 abstracts.
  - Gold rationales are short sentence sets (typically 1-3 sentences) per abstract.
  - The fixture represents the joint verdict-plus-evidence success rule at the
    sentence level, reusing the existing FEVEROUS-style joint scorer via
    vocabulary normalization.
