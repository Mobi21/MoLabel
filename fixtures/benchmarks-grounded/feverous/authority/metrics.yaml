benchmark_id: feverous
aggregation: weighted_mean
primary_metric_id: feverous_score_proxy
metrics:
  - metric_id: feverous_score
    name: FEVEROUS Score
    metric_type: feverous_score
    modes:
      - model
      - workflow
      - operator
    variants:
      - paper_direct
    weight: 1.0
    notes: Exact FEVEROUS paper-direct success criterion.
  - metric_id: feverous_score_proxy
    name: FEVEROUS Score Proxy
    metric_type: exact_match
    modes:
      - model
      - workflow
      - operator
    variants:
      - molabel_operated
    fields:
      - verdict
      - evidence_atoms
    weight: 1.0
    notes: MoLabel-friendly proxy for the FEVEROUS joint success criterion.
  - metric_id: verdict_accuracy
    name: Verdict Accuracy
    metric_type: accuracy
    modes:
      - model
      - workflow
      - operator
    variants:
      - molabel_operated
    fields:
      - verdict
    weight: 0.0
    notes: Correct FEVEROUS verdict only.
  - metric_id: evidence_precision
    name: Evidence Precision
    metric_type: set_precision
    modes:
      - model
      - workflow
      - operator
    variants:
      - molabel_operated
    fields:
      - evidence_atoms
    weight: 0.0
    notes: Diagnostic evidence precision.
  - metric_id: evidence_recall
    name: Evidence Recall
    metric_type: set_recall
    modes:
      - model
      - workflow
      - operator
    variants:
      - molabel_operated
    fields:
      - evidence_atoms
    weight: 0.0
    notes: Diagnostic evidence recall.
  - metric_id: evidence_f1
    name: Evidence F1
    metric_type: set_f1
    modes:
      - model
      - workflow
      - operator
    variants:
      - molabel_operated
    fields:
      - evidence_atoms
    weight: 0.0
    notes: MoLabel-operated evidence score proxy.
tax_definitions:
  - tax_id: model_tax
    name: Model Tax
    minuend_mode: model
    minuend_variant: paper_direct
    subtrahend_mode: model
    subtrahend_variant: molabel_operated
    minuend_stage: paper_model
    subtrahend_stage: molabel_model
    notes: Gap between paper-direct model scoring and MoLabel-normalized model scoring.
  - tax_id: autorun_tax
    name: Autorun Tax
    minuend_mode: model
    minuend_variant: molabel_operated
    subtrahend_mode: workflow
    subtrahend_variant: molabel_operated
    minuend_stage: molabel_model
    subtrahend_stage: workflow_autorun
    notes: Gap introduced by MoLabel workflow operations relative to the model-only MoLabel baseline.
  - tax_id: review_tax
    name: Review Tax
    minuend_mode: workflow
    minuend_variant: molabel_operated
    subtrahend_mode: workflow
    subtrahend_variant: molabel_operated
    minuend_stage: workflow_autorun
    subtrahend_stage: workflow_reviewed
    notes: Gap introduced by the workflow review step relative to autorun proposals.
  - tax_id: operator_tax
    name: Operator Tax
    minuend_mode: workflow
    minuend_variant: molabel_operated
    subtrahend_mode: operator
    subtrahend_variant: molabel_operated
    minuend_stage: workflow_reviewed
    subtrahend_stage: operator_reviewed
    notes: Gap introduced by the external CLI-and-skill operator relative to the workflow baseline.
