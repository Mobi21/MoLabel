benchmark_id: toxic-spans
goal: Evaluate Codex as an external MoLabel operator on the grounded Toxic Spans slice
  using only the public CLI and installed benchmark skill, with MiniMax 2.7 as the
  current labeling engine.
current_labeling_engine: MiniMax 2.7
authority_pack: true
reference_workspace_root: ../workbench
benchmark_profiles:
- canonical
- operator-primary
- smoke
aggregation: weighted_mean
label_quality_weight: 0.7
checklist_weight: 0.3
blocking_check_ids:
- uses_public_cli_and_skill_only
- configures_minimax_2_7_profile
- preserves_artifact_integrity
checks:
- check_id: uses_public_cli_and_skill_only
  phase: setup
  description: Uses only documented MoLabel CLI surfaces with the installed benchmark
    skill.
  weight: 1.0
- check_id: configures_minimax_2_7_profile
  phase: setup
  description: Registers MiniMax 2.7 through the Anthropic-compatible adapter path.
  weight: 1.0
- check_id: preserves_char_offset_contract
  phase: run
  description: Preserves toxic rationale character offsets instead of flattening them
    into token lists.
  weight: 1.0
- check_id: preserves_stable_span_offsets
  phase: run
  description: Emits only stable span offsets from the authority slice.
  weight: 1.0
- check_id: keeps_overlap_and_exact_distinct_in_reports
  phase: review
  description: Reports partial overlap separately from exact rationale boundaries.
  weight: 1.0
- check_id: writes_benchmark_run_artifacts
  phase: scoring
  description: Writes summary and report artifacts under workbench/benchmarks/runs.
  weight: 1.0
- check_id: preserves_artifact_integrity
  phase: scoring
  description: Leaves benchmark metadata and span artifacts schema-valid after the
    run.
  weight: 1.0
