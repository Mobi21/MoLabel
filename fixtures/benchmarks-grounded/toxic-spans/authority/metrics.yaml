benchmark_id: toxic-spans
aggregation: weighted_mean
primary_metric_id: span_overlap_f1
metrics:
- metric_id: span_overlap_f1
  name: Span Overlap F1
  metric_type: span_overlap_f1
  modes:
  - model
  - workflow
  - operator
  variants:
  - paper_direct
  - molabel_operated
  fields:
  - spans
  weight: 1.0
- metric_id: span_exact_match
  name: Span Exact Match
  metric_type: span_exact_match
  modes:
  - model
  - workflow
  - operator
  variants:
  - paper_direct
  - molabel_operated
  fields:
  - spans
  weight: 0.0
tax_definitions:
- tax_id: model_tax
  name: Model Tax
  minuend_mode: model
  minuend_variant: paper_direct
  subtrahend_mode: model
  subtrahend_variant: molabel_operated
  notes: Gap between paper-direct and MoLabel-operated scoring.
- tax_id: workflow_tax
  name: Workflow Tax
  minuend_mode: model
  minuend_variant: molabel_operated
  subtrahend_mode: workflow
  subtrahend_variant: molabel_operated
  notes: Gap introduced by workflow execution.
- tax_id: operator_tax
  name: Operator Tax
  minuend_mode: workflow
  minuend_variant: molabel_operated
  subtrahend_mode: operator
  subtrahend_variant: molabel_operated
  notes: Gap introduced by the external CLI operator.
