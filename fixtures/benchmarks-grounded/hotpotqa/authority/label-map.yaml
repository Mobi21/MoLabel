benchmark_id: hotpotqa
record_id_field: record_id
dataset_label_fields:
- answer
- supporting_facts
target_label_fields:
- qa_bundle
field_mappings:
- dataset_field: answer
  target_field: qa_bundle
  mapping:
    structure: qa_answer_text
  lossy: false
  notes: Answer text is preserved directly.
- dataset_field: supporting_facts
  target_field: qa_bundle
  mapping:
    structure: document_id_plus_fact_id_pairs
  lossy: false
  notes: Supporting facts remain explicit multi-hop references.
