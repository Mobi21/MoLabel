benchmark_id: webnlg
goal: Evaluate Codex as an external MoLabel operator on the grounded WebNLG slice
  using only the public CLI and installed benchmark skill, with MiniMax 2.7 as the
  current labeling engine.
current_labeling_engine: MiniMax 2.7
authority_pack: true
reference_workspace_root: ../workbench
benchmark_profiles:
- canonical
- operator-primary
- smoke
aggregation: weighted_mean
label_quality_weight: 0.7
checklist_weight: 0.3
blocking_check_ids:
- uses_public_cli_and_skill_only
- configures_minimax_2_7_profile
- preserves_artifact_integrity
checks:
- check_id: uses_public_cli_and_skill_only
  phase: setup
  description: Uses only documented MoLabel CLI surfaces with the installed benchmark
    skill.
  weight: 1.0
- check_id: configures_minimax_2_7_profile
  phase: setup
  description: Registers MiniMax 2.7 through the Anthropic-compatible adapter path.
  weight: 1.0
- check_id: preserves_triple_anchors
  phase: run
  description: Keeps every generated claim traceable to source triple anchors.
  weight: 1.0
- check_id: preserves_required_verbalization_structure
  phase: run
  description: Returns the required structured verbalization field alongside the text.
  weight: 1.0
- check_id: keeps_grounding_and_unsupported_content_separate
  phase: review
  description: Reports source coverage separately from unsupported content rate.
  weight: 1.0
- check_id: writes_benchmark_run_artifacts
  phase: scoring
  description: Writes summary and report artifacts under workbench/benchmarks/runs.
  weight: 1.0
- check_id: preserves_artifact_integrity
  phase: scoring
  description: Leaves benchmark metadata and generation artifacts schema-valid after
    the run.
  weight: 1.0
