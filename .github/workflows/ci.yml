name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest tests/ -v --tb=short

      # TODO: Coverage reporting (non-blocking, SC-012)
      # - name: Coverage
      #   run: uv run pytest tests/ -v --cov=molabel --cov-report=xml || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npx eslint .

      - name: Format check (prettier)
        run: cd frontend && npx prettier --check .

      - name: Type check
        run: cd frontend && npx tsc -b

      - name: Tests
        run: cd frontend && npm run test -- --run

      - name: Build
        run: cd frontend && npm run build

      # TODO: Lighthouse CI (non-blocking, SC-012)
      # - name: Lighthouse
      #   run: cd frontend && npx lhci autorun || true

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (prettier)
        run: npx prettier --check .

      - name: Type check and build
        run: npm run build

      - name: Tests
        run: npm test

  smoke-no-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv sync

      - name: Build the CLI
        working-directory: cli
        run: npm ci && npm run build

      - name: Import, offline pre-label, review, and export with no API key
        run: uv run python scripts/smoke_no_key.py

  e2e-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv sync

      - name: Build the CLI
        working-directory: cli
        run: npm ci && npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium

      - name: Review, calibrate, and adjudicate in a browser on the real backend
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/

  openapi-sync:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv sync

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Generate OpenAPI spec
        run: |
          uv run python -c "
          from molabel.app.main import create_app
          import json
          print(json.dumps(create_app().openapi()))
          " > "$RUNNER_TEMP/openapi.json"

      - name: Regenerate the frontend API client
        run: cd frontend && MOLABEL_OPENAPI_INPUT="$RUNNER_TEMP/openapi.json" npm run generate:api

      - name: Fail if the committed client differs from the spec
        run: |
          git diff --exit-code -- frontend/src/api/generated
          test -z "$(git status --porcelain -- frontend/src/api/generated)"
