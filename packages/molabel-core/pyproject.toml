[project]
name = "molabel-core"
version = "0.1.0"
description = "MoLabel core library: data model, workflow engine, plugin system, and provider adapters"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.14",
    "httpx>=0.28",
    "packaging>=23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molabel"]
