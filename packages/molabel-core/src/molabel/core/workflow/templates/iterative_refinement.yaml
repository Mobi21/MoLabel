name: "Iterative Refinement"
version: 1
description: >
  Run an agent, review low-confidence outputs, refine the prompt, and
  loop until a quality target is met. Designed for prompt engineering
  workflows where you iterate to improve agent accuracy.

steps:
  - id: ingest
    type: data_ingest
    config:
      source: "data/raw/*.jsonl"

  - id: normalize
    type: data_normalize
    config:
      schema_ref: "schemas/default.yaml"

  - id: agent_label
    type: agent_run
    config:
      prompt_ref: "prompts/default.yaml"
      model: "claude-sonnet-4-20250514"
      agent_role: proposer

  - id: sample_low_confidence
    type: data_sample
    config:
      sample_strategy: confidence_based
      sample_size: 50

  - id: review
    type: human_review
    config:
      sample_strategy: all
      breakpoint: true

  - id: quality
    type: quality_check
    config:
      min_agreement: 0.90
      min_coverage: 0.95

  - id: refinement_loop
    type: loop
    config:
      steps: [agent_label, sample_low_confidence, review, quality]
      termination:
        type: metric
        metric: "quality.agreement"
        operator: ">="
        threshold: 0.95
        max_iterations: 10

  - id: final_snapshot
    type: snapshot
    depends_on: [refinement_loop]
    config:
      snapshot_name: "refined_labels"

  - id: export_results
    type: export
    config:
      format: jsonl
      destination: "exports/"
