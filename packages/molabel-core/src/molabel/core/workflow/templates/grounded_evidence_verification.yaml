name: "Grounded Evidence Verification"
version: 1
description: >
  Grounded verification workflow that preserves stable evidence atom IDs and
  pauses for human review before adjudication.

steps:
  - id: ingest
    type: data_ingest
    config:
      source: "workbench/benchmarks/splits/dev.jsonl"
      record_id_field: "record_id"

  - id: normalize
    type: data_normalize
    config:
      schema_ref: "workbench/config/task-schemas/evidence-verification.yaml"

  - id: propose_labels
    type: agent_run
    depends_on: [normalize]
    config:
      task_schema_id: evidence-verification
      prompt_ref: evidence-verification-prompt
      model: MiniMax-M2.7-highspeed
      provider_type: anthropic
      provider_name: MiniMax
      base_url: https://api.minimax.io/anthropic
      agent_role: proposer

  - id: review
    type: human_review
    depends_on: [propose_labels]
    config:
      sample_strategy: all
      task_schema_id: evidence-verification
      breakpoint: true

  - id: adjudicate
    type: human_adjudication
    depends_on: [review]
    config:
      adjudication_policy: expert_consensus

  - id: export_results
    type: export
    depends_on: [adjudicate]
    config:
      format: jsonl
      destination: "workbench/benchmarks/runs"
