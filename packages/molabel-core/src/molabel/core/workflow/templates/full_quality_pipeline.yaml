name: "Full Quality Pipeline"
version: 1
description: >
  Comprehensive pipeline: ingest, agent run, human review, agreement
  analysis, adjudication, quality check, export, and release validation.
  Reviewer calibration against a gold set is planned with gold sets (P8).

steps:
  - id: ingest
    type: data_ingest
    config: {}

  - id: normalize
    type: data_normalize
    config: {}

  - id: agent_label
    type: agent_run
    config:
      prompt_ref: "prompts/default.yaml"
      model: "claude-sonnet-4-20250514"
      agent_role: proposer

  - id: review
    type: human_review
    config:
      sample_strategy: stratified
      sample_size: 200
      breakpoint: true

  - id: agreement
    type: agreement_analysis
    config:
      analysis_type: both

  - id: adjudication
    type: human_adjudication
    config:
      adjudication_policy: majority_vote

  - id: quality
    type: quality_check
    config:
      # min_agreement is Krippendorff's alpha. Rely on >= .800, and draw only
      # tentative conclusions from .667 to .800 (Krippendorff, Content
      # Analysis, 2nd ed., 2004, reliability chapter, p. 241).
      min_agreement: 0.80
      min_coverage: 0.95
      min_confidence: 0.80

  - id: approve_export
    type: gate
    config:
      message: "Quality checks passed. Approve export?"
      require_reason: false

  - id: export_results
    type: export
    config:
      format: jsonl
      destination: "exports/"

  - id: validate_release
    type: release_validation
    config:
      validation_gates: []
